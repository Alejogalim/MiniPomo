<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3d2f4a" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>MiniPomo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app">
      <div id="stage">
        <div id="pet"></div>
        <div id="sign">
          <div id="total">0</div>
          <div id="panel">
            <div id="view-timer">
              <div id="time">25:00</div>
              <div id="mode">focus</div>
              <div id="cycles"><i></i><i></i><i></i><i></i></div>
            </div>
            <div id="view-settings">
              <button id="reset" aria-label="Reset timer">↺</button>
              <button id="character" aria-label="Change character">✦</button>
              <button id="resize" aria-label="Resize">⤢</button>
              <button id="tracker" aria-label="Open tracker">
                <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
                  <g fill="currentColor">
                    <rect x="7" y="0" width="2" height="3.2" />
                    <rect x="7" y="12.8" width="2" height="3.2" />
                    <rect x="0" y="7" width="3.2" height="2" />
                    <rect x="12.8" y="7" width="3.2" height="2" />
                    <path
                      fill-rule="evenodd"
                      d="M8 3.1a4.9 4.9 0 1 0 0 9.8 4.9 4.9 0 0 0 0-9.8Zm0 3.1a1.8 1.8 0 1 1 0 3.6 1.8 1.8 0 0 1 0-3.6Z"
                    />
                  </g>
                </svg>
              </button>
            </div>
          </div>
          <button id="toggle" class="corner" aria-label="Start or pause">▶</button>
          <button id="settings" class="corner" aria-label="Settings">≡</button>
        </div>
      </div>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
